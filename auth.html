<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e8" />
    <meta name="description" content="Sign in or create your What Should I Do? account." />
    <title>Sign in — What Should I Do?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="cover-page auth-page">
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>What Should I Do?</span></a><a class="header-home-link" href="index.html">← Home</a></header>
    <main class="auth-main">
      <section class="auth-intro"><p class="eyebrow">YOUR COURSE ACCOUNT</p><h1>Keep your work with you.</h1><p>Sign in to securely save your notes, values, and Time Audit for one year and access them from any device.</p></section>
      <section class="auth-card" aria-labelledby="authTitle">
        <div class="auth-tabs" role="tablist"><button class="active" type="button" data-auth-tab="signin">Sign in</button><button type="button" data-auth-tab="signup">Create account</button></div>
        <h2 id="authTitle">Welcome back</h2>
        <p id="authDescription">Enter your email and password to continue.</p>
        <form id="authForm">
          <label id="nameField" hidden><span>Name</span><input name="fullName" type="text" autocomplete="name" maxlength="80" /></label>
          <label><span>Email</span><input name="email" type="email" autocomplete="email" required /></label>
          <label><span>Password</span><input name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
          <button class="cover-primary" id="authSubmit" type="submit">Sign in <span aria-hidden="true">→</span></button>
          <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
        </form>
        <button class="text-button" id="forgotPassword" type="button">Forgot your password?</button>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="cloud-sync.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
